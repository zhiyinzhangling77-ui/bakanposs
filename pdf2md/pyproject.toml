[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF(教科書・論文) → AIで勉強しやすい Markdown 変換パイプライン"
requires-python = ">=3.10"
# 依存(marker-pdf, PyMuPDF, anthropic)は requirements.txt / setup_venv.sh で導入。
# ここに再掲すると再解決が走るため、あえて空にしている。

[project.scripts]
pdf2md = "pdf2md.cli:main"

[tool.setuptools]
packages = ["pdf2md"]
